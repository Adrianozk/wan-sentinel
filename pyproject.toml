[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wan-sentinel"
version = "0.1.0"
description = "Read-only multi-WAN observability for RouterOS 7"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
wan-sentinel = "wan_sentinel.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
